name: Automação Banco de Fornecedores INCA

on:
  schedule:
    # Executa automaticamente toda segunda-feira às 08h00 UTC
    - cron: '0 8 * * 1' 
  workflow_dispatch: # Permite rodar manualmente a qualquer momento

jobs:
  executar-script:
    runs-on: ubuntu-latest

    steps:
    - name: Baixar código do repositório
      uses: actions/checkout@v4

    - name: Configurar ambiente Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Instalar dependências necessárias
      run: |
        python -m pip install --upgrade pip
        pip install requests pandas openpyxl

    - name: Executar script do mapeador
      run: python mapeador_fornecedores.py

    - name: Gerar e disponibilizar arquivo Excel
      uses: actions/upload-artifact@v4
      with:
        name: Planilha-Fornecedores-INCA
        path: fornecedores_inca_saude.xlsx
